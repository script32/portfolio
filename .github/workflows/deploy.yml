# =============================================================================
# GitHub Actions Workflow para Portfolio de Cristian Rodriguez
# Demuestra capacidad de gestión de pipelines CI/CD
# =============================================================================

name: Build and Deploy Portfolio

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # =============================================================================
  # Job 1: Build del sitio Jekyll
  # =============================================================================
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        
      - name: 💎 Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          
      - name: 📦 Install dependencies
        run: |
          gem install bundler
          bundle install --jobs 4 --retry 3
          
      - name: 🔧 Setup Pages
        id: pages
        uses: actions/configure-pages@v4
        
      - name: 🏗️ Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
          
      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  # =============================================================================
  # Job 2: Deploy a GitHub Pages
  # =============================================================================
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # =============================================================================
  # Job 3: Validación de enlaces y HTML (opcional, para PRs)
  # =============================================================================
  validate:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        
      - name: 💎 Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          
      - name: 📦 Install dependencies
        run: |
          gem install bundler
          bundle install --jobs 4 --retry 3
          
      - name: 🏗️ Build for validation
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
          
      - name: 🔍 Check HTML
        uses: chabad360/htmlproofer@master
        with:
          directory: "./_site"
          arguments: |
            --disable-external
            --allow-hash-href
            --ignore-empty-alt
        continue-on-error: true
